[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sig-etl"
version = "0.1.0"
description = "Pipeline ETL : communes IGN (WFS Géoplateforme) vers PostGIS"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.6",
]

[project.scripts]
sig-etl = "sig_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
