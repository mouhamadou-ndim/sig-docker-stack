# Image nginx-unprivileged : le processus tourne sans droits root et écoute sur 8080.
# Le système de fichiers du conteneur est en lecture seule, seul /tmp est inscriptible.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Ne pas divulguer la version de Nginx
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    # Limites contre les requêtes lentes ou volumineuses
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    reset_timedout_connection on;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # Limitation de débit et de connexions par adresse IP
    limit_req_zone $binary_remote_addr zone=ogc_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=ogc_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/xml text/xml;

    include /etc/nginx/conf.d/*.conf;
}
