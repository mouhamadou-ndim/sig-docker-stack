upstream geoserver_upstream {
    server geoserver:8080;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Interface d'administration et API REST de GeoServer : jamais exposées.
    # Placé avant la règle OGC pour qu'un espace de travail ne puisse pas porter ces noms.
    location ~* ^/geoserver/(?:web|rest|gwc/rest|j_spring_security[^/]*)(?:/|$) {
        return 403;
    }

    # Liste blanche : services OGC globaux ou par espace de travail, en lecture seule.
    location ~ ^/geoserver/(?:[A-Za-z0-9_-]+/)?(?:ows|wms|wfs)$ {
        limit_except GET {
            deny all;
        }
        limit_req zone=ogc_req burst=40 nodelay;
        limit_conn ogc_conn 20;

        proxy_pass http://geoserver_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Valeur imposée (et non complétée) pour empêcher l'usurpation par le client
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        # GeoServer envoie ses propres en-têtes de sécurité : on ne garde que ceux de Nginx
        # pour éviter les doublons et les valeurs contradictoires.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Tout le reste est refusé.
    location / {
        return 403;
    }
}
