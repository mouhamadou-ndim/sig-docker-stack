name: sig-stack

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgis:
    image: postgis/postgis:${POSTGIS_IMAGE_TAG:-17-3.5}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sig}
      POSTGRES_USER: ${POSTGRES_USER:-sig_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant (voir .env.example)}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?ETL_DB_PASSWORD manquant (voir .env.example)}
      GEOSERVER_DB_PASSWORD: ${GEOSERVER_DB_PASSWORD:?GEOSERVER_DB_PASSWORD manquant (voir .env.example)}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      # Montés fichier par fichier pour ne pas masquer le script d'init de l'image PostGIS.
      - ./postgis/init/20-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
      - ./postgis/init/30-schema.sql:/docker-entrypoint-initdb.d/30-schema.sql:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # En TCP : pendant l'initialisation, le serveur temporaire n'écoute que sur le socket Unix.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *logging

  geoserver:
    image: docker.osgeo.org/geoserver:${GEOSERVER_IMAGE_TAG:-2.28.6}
    restart: unless-stopped
    environment:
      SKIP_DEMO_DATA: "true"
      RUN_UNPRIVILEGED: "true"
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD manquant (voir .env.example)}
      PROXY_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/geoserver
      EXTRA_JAVA_OPTS: -Xms256m -Xmx1g
    volumes:
      - geoserver_data:/opt/geoserver_data
    networks:
      - frontend
      - backend
    depends_on:
      postgis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://localhost:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    logging: *logging

  nginx:
    image: nginxinc/nginx-unprivileged:${NGINX_IMAGE_TAG:-1.30-alpine}
    restart: unless-stopped
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - edge
      - frontend
    depends_on:
      geoserver:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging: *logging

  # Tâche ponctuelle : docker compose run --rm etl
  etl:
    build: ./etl
    image: sig-etl:local
    profiles: ["jobs"]
    environment:
      PGHOST: postgis
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-sig}
      PGUSER: etl_writer
      PGPASSWORD: ${ETL_DB_PASSWORD:?ETL_DB_PASSWORD manquant (voir .env.example)}
      PGCONNECT_TIMEOUT: "10"
      ETL_DEPARTEMENTS: ${ETL_DEPARTEMENTS:-91}
    networks:
      - backend
      - egress
    depends_on:
      postgis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Tâche ponctuelle : docker compose run --rm geoserver-init
  geoserver-init:
    image: curlimages/curl:${CURL_IMAGE_TAG:-8.23.0}
    profiles: ["jobs"]
    entrypoint: ["/bin/sh", "/init/publish.sh"]
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD manquant (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-sig}
      GEOSERVER_DB_PASSWORD: ${GEOSERVER_DB_PASSWORD:?GEOSERVER_DB_PASSWORD manquant (voir .env.example)}
    volumes:
      - ./geoserver/publish.sh:/init/publish.sh:ro
    networks:
      - frontend
    depends_on:
      geoserver:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  # Seul réseau relié à l'hôte : porte le port publié de Nginx.
  edge:
  # Nginx <-> GeoServer, sans route vers l'extérieur.
  frontend:
    internal: true
  # GeoServer / ETL <-> PostGIS, sans route vers l'extérieur.
  backend:
    internal: true
  # Sortie Internet réservée à la tâche ETL (appel de l'API IGN).
  egress:

volumes:
  postgis_data:
  geoserver_data:
