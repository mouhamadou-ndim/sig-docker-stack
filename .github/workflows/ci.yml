name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque lundi : vérifie que l'API IGN et le pipeline fonctionnent toujours
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl-tests:
    name: ETL - lint et tests unitaires
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/pyproject.toml
      - name: Installer le paquet et les outils
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests unitaires
        run: pytest -q

  stack:
    name: Stack Docker - ETL et tests de bout en bout
    needs: etl-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Générer un .env éphémère
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "ETL_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "GEOSERVER_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "GEOSERVER_ADMIN_PASSWORD=$(openssl rand -hex 24)"
          } > .env

      - name: Valider la configuration Compose
        run: docker compose --profile jobs config --quiet

      - name: Construire l'image ETL
        run: docker compose --profile jobs build etl

      - name: Démarrer PostGIS, GeoServer et Nginx
        run: docker compose up -d --wait --wait-timeout 420

      - name: Exécuter l'ETL (API IGN vers PostGIS)
        run: docker compose run --rm etl run

      - name: Rejouer l'ETL (idempotence)
        run: docker compose run --rm etl run

      - name: Vérifier les données chargées
        run: docker compose run --rm etl verify

      - name: Publier la couche dans GeoServer
        run: docker compose run --rm geoserver-init

      - name: Rejouer la publication (idempotence)
        run: docker compose run --rm geoserver-init

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests de bout en bout
        run: |
          pip install pytest requests
          pytest -q tests/stack

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150

      - name: Arrêter la stack
        if: always()
        run: docker compose --profile jobs down -v
